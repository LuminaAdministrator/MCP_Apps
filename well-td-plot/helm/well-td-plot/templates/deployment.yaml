apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "well-td-plot.fullname" . }}
  labels:
    {{- include "well-td-plot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "well-td-plot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "well-td-plot.labels" . | nindent 8 }}
    spec:
      containers:
        - name: well-td-plot
          image: "{{ .Values.image.repository }}:{{ include "well-td-plot.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
