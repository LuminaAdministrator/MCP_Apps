[project]
name = "well-td-plot"
version = "1.0.0"
description = "JIO-compatible MCP app for Time-Depth function plotting using Vega-Lite"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "jsonschema>=4.22",
    "referencing>=0.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "anyio>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/well_td_plot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
