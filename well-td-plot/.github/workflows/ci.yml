name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        env:
          TD_PLOT_DATA_SOURCE_MODE: fixture
        run: pytest -v

      - name: Validate bundled fixtures against public schema
        run: |
          python -c "
          import json, jsonschema, sys
          from pathlib import Path
          from referencing import Registry, Resource

          schemas_dir = Path('schemas')
          registry = Registry()
          for p in schemas_dir.glob('*.json'):
              c = json.loads(p.read_text())
              if isinstance(c, dict) and '\$id' in c:
                  registry = registry.with_resource(c['\$id'], Resource.from_contents(c))

          schema = json.loads((schemas_dir / 'app_instance_envelope.public.schema.json').read_text())
          instance = json.loads(Path('fixtures/envelope.example.json').read_text())
          v = jsonschema.Draft202012Validator(schema, registry=registry)
          errors = list(v.iter_errors(instance))
          if errors:
              for e in errors:
                  print(e, file=sys.stderr)
              sys.exit(1)
          print('fixtures/envelope.example.json OK')
          "

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t well-td-plot:ci .

      - name: Smoke-test container health endpoint
        run: |
          docker run -d --name td-plot-test -p 8080:8080 well-td-plot:ci
          sleep 3
          curl -sf http://localhost:8080/health
          docker stop td-plot-test
